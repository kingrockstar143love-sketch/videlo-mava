name: Build VIBE NOVA CLIPS APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Extract project
        run: |
          unzip -o vibe-nova-clips-starter.zip -d temp
          cp -r temp/vibe-nova-clips/. .
      - name: Create Android files
        run: flutter create --platforms=android --project-name vibe_nova_clips .

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VIBE-NOVA-CLIPS-APK
          path: build/app/outputs/flutter-apk/app-release.apk
