
name: Build VIBE NOVA CLIPS APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Extract Flutter project
        run: |
          if [ -f vibe-nova-autoedit-v3.zip ]; then
            mkdir -p /tmp/vibe-project
            unzip -q vibe-nova-autoedit-v3.zip -d /tmp/vibe-project
            PROJECT_DIR="$(find /tmp/vibe-project -name pubspec.yaml -printf '%h\n' | head -n 1)"
            if [ -z "$PROJECT_DIR" ]; then
              echo "ERROR: pubspec.yaml not found in ZIP"
              exit 1
            fi
            cp -a "$PROJECT_DIR"/. .
          fi

          if [ ! -f pubspec.yaml ]; then
            echo "ERROR: Flutter project not found"
            exit 1
          fi

      - name: Generate Android project files
        run: flutter create --platforms=android .

      - name: Fix Android build settings
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("android/app/build.gradle.kts")
          s = p.read_text()

          s = re.sub(
              r'compileSdk\s*=\s*flutter\.compileSdkVersion',
              'compileSdk = 36',
              s
          )

          if 'isMinifyEnabled' not in s:
              s, count = re.subn(
                  r'(release\s*\{)',
                  r'\1\n            isMinifyEnabled = false',
                  s,
                  count=1
              )
              if count == 0:
                  raise SystemExit("Release build block not found")

          p.write_text(s)
          print("Android build settings updated")
          print(s)
          PY

      - name: Install Flutter packages
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release --no-shrink

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VIBE-NOVA-CLIPS-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          
